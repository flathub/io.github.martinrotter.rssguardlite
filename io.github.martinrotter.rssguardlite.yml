id: io.github.martinrotter.rssguardlite
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang # To build rssguard-article-extractor
command: rssguard

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: clang-format
    buildsystem: cmake-ninja
    subdir: llvm
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DBUILD_SHARED_LIBS=OFF
      - -DLLVM_ENABLE_PROJECTS=clang
    make-args:
      - clang-format
    no-make-install: true
    build-commands:
      - install -Dt /app/bin bin/clang-format
    sources:
      - type: archive
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/llvm-project-23.1.3.src.tar.xz
        sha256: c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34
        x-checker-data:
          type: anitya
          project-id: 1830
          stable-only: true
          url-template: https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/llvm-project-$version.src.tar.xz

  - name: qxmpp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_DOCUMENTATION=OFF
      - -DBUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://download.kde.org/unstable/qxmpp/qxmpp-1.17.0.tar.xz
        sha256: 06247ba01a60f64aa679c241a880f3e68ebc6a7700bcd1dfe90bca22fc47bfb2
        x-checker-data:
          type: anitya
          project-id: 4149
          stable-only: true
          url-template: https://download.kde.org/unstable/qxmpp/qxmpp-$version.tar.xz
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: rssguard
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOROOT: /usr/lib/sdk/golang
    config-opts:
      - -DIS_DEV_BUILD=OFF
      - -DREVISION_FROM_GIT=OFF
      - -DNO_UPDATE_CHECK=ON
      - -DIS_FLATPAK_BUILD=ON
      - -DBUILD_XMPP_PLUGIN=ON
      - -DWEB_ARTICLE_VIEWER_WEBENGINE=OFF
      - -DENABLE_MEDIAPLAYER_LIBMPV=OFF
    sources:
      - type: archive
        url: https://github.com/martinrotter/rssguard/releases/download/5.2.5/rssguard-5.2.5-src.tar.gz
        sha256: 5051308aaff854e5b1948e23b02871cd8d4fb4b870bdb688a8b98e907e6a0614
        x-checker-data:
          type: anitya
          project-id: 19046
          stable-only: true
          url-template: https://github.com/martinrotter/rssguard/releases/download/$version/rssguard-$version-src.tar.gz
    cleanup:
      - /include
